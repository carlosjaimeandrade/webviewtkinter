<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen 1</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7ed;
      color: #431407;
    }

    nav {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      background: #7c2d12;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      background: #ea580c;
      border-radius: 8px;
    }

    main {
      padding: 32px 24px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      background: #ea580c;
      color: #fff;
      cursor: pointer;
      border-radius: 8px;
    }

    #result {
      margin-top: 20px;
      padding: 16px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #fed7aa;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="tela1.html">Screen 1</a>
    <a href="tela2.html">Screen 2</a>
  </nav>

  <main>
    <h1>Screen 1</h1>
    <p>This page also calls the Python bridge.</p>
    <button onclick="callPython()">Call Python from Screen 1</button>
    <div id="result">Waiting for a call...</div>
  </main>

  <script>
    window.receive.ping_python((params) => {
      document.getElementById("result").innerText =
        "Callback from Python:\n" + JSON.stringify(params, null, 2);
    });

    async function callPython() {
      const result = await window.send.ping_python("tela1.html", "screen1", 1);
      document.getElementById("result").innerText =
        "Direct return:\n" + result;
    }
  </script>
</body>
</html>
