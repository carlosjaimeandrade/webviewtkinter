<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen 2</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ecfeff;
      color: #083344;
    }

    nav {
      display: flex;
      gap: 12px;
      padding: 16px 24px;
      background: #164e63;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      background: #0891b2;
      border-radius: 8px;
    }

    main {
      padding: 32px 24px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      background: #0891b2;
      color: #fff;
      cursor: pointer;
      border-radius: 8px;
    }

    #result {
      margin-top: 20px;
      padding: 16px;
      background: #fff;
      border-radius: 10px;
      border: 1px solid #a5f3fc;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="tela1.html">Screen 1</a>
    <a href="tela2.html">Screen 2</a>
  </nav>

  <main>
    <h1>Screen 2</h1>
    <p>This page calls the same Python function with different arguments.</p>
    <button onclick="callPython()">Call Python from Screen 2</button>
    <div id="result">Waiting for a call...</div>
  </main>

  <script>
    window.receive.ping_python((params) => {
      document.getElementById("result").innerText =
        "Callback from Python:\n" + JSON.stringify(params, null, 2);
    });

    async function callPython() {
      const result = await window.send.ping_python("tela2.html", "screen2", { active: true });
      document.getElementById("result").innerText =
        "Direct return:\n" + result;
    }
  </script>
</body>
</html>
